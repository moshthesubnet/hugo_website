<div class="home-contact-heading">
  <span class="home-contact-heading-text">Contact</span>
  <div class="home-contact-heading-line"></div>
</div>
<p class="home-contact-desc">Open to networking, opportunities, and collaboration. Drop me a message and I'll get back to you.</p>
<div class="home-contact-card">
  <div class="home-contact-success" data-fs-success>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
    Message sent — I'll get back to you soon.
  </div>
  <div class="home-contact-form-error" data-fs-error></div>
  <form id="contact-form" class="home-contact-form">
    <div class="home-contact-field">
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" placeholder="Your name" required data-fs-field>
      <span class="home-contact-field-error" data-fs-error="name"></span>
    </div>
    <div class="home-contact-field">
      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="email" placeholder="your@email.com" required data-fs-field>
      <span class="home-contact-field-error" data-fs-error="email"></span>
    </div>
    <div class="home-contact-field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="5" placeholder="What's on your mind?" required data-fs-field></textarea>
      <span class="home-contact-field-error" data-fs-error="message"></span>
    </div>
    <button type="submit" class="home-contact-submit" data-fs-submit-btn>Send Message</button>
  </form>
</div>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { formElement: '#contact-form', formId: 'meepbbyw' });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>

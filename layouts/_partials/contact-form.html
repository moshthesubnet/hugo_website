<div class="home-contact-heading">
  <span class="home-contact-heading-text">Contact</span>
  <div class="home-contact-heading-line"></div>
</div>
<p class="home-contact-desc">Open to networking, opportunities, and collaboration. Drop me a message and I'll get back to you.</p>
<div class="home-contact-card">
  <form action="https://formspree.io/f/meepbbyw" method="POST" class="home-contact-form">
    <input type="hidden" name="_next" value="https://moshthesubnet.com/?thanks=1">
    <div class="home-contact-field">
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" placeholder="Your name" required>
    </div>
    <div class="home-contact-field">
      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="email" placeholder="your@email.com" required>
    </div>
    <div class="home-contact-field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
    </div>
    <button type="submit" class="home-contact-submit">Send Message</button>
  </form>
</div>

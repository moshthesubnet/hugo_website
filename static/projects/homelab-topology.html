<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Lab Network Topology</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #111111;
            color: #b0b0b0;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* -- Header --------------------------------------------------------- */
        .header {
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #262626;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 2rem;
            font-weight: 400;
            color: #fafafa;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .subtitle {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            color: #525252;
        }

        /* -- Stats row ------------------------------------------------------ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px 16px;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: #525252;
        }

        .stat-number {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 1.75rem;
            font-weight: 700;
            color: #5eead4;
        }

        .stat-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            color: #525252;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* -- Section wrapper ------------------------------------------------ */
        .topology-section {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .section-title {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* -- Physical topology layers --------------------------------------- */
        .topology-layers {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .topology-layer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .layer-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #525252;
            margin-bottom: 10px;
        }

        .layer-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        /* -- Device cards --------------------------------------------------- */
        .device {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 18px;
            transition: border-color 0.2s ease;
            min-width: 170px;
        }

        .device:hover {
            border-color: #525252;
        }

        .device.clickable { cursor: pointer; }

        .device-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon {
            width: 38px; height: 38px;
            background: rgba(94, 234, 212, 0.08);
            border: 1px solid rgba(94, 234, 212, 0.15);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .device-name {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #fafafa;
        }

        .device-subtitle {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            color: #525252;
            margin-top: 2px;
        }

        .vlan-badge {
            display: inline-block;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.625rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 3px;
            margin-top: 8px;
        }

        /* -- Connectors ----------------------------------------------------- */
        .layer-connector {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0;
        }

        .connector-line {
            width: 1px; height: 24px;
            background: #262626;
        }

        .connector-arrow {
            font-size: 0.75rem;
            color: #525252;
        }

        .connector-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.625rem;
            color: #525252;
            margin-top: 2px;
        }

        /* -- Proxmox compound box ------------------------------------------- */
        .proxmox-compound {
            width: 100%;
            background: rgba(94, 234, 212, 0.03);
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
        }

        .proxmox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .proxmox-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            color: #5eead4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .proxmox-meta {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #525252;
        }

        .guest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .guest-card {
            background: #111111;
            border-left: 3px solid;
            border-radius: 3px;
            padding: 8px 12px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .guest-card:hover {
            background: #1a1a1a;
        }

        .guest-card.dimmed { opacity: 0.15; }

        .guest-name { color: #a3a3a3; font-weight: 500; }
        .guest-type { font-size: 0.625rem; color: #525252; text-transform: uppercase; letter-spacing: 0.5px; }

        /* -- VLAN items ----------------------------------------------------- */
        .vlan-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vlan-item {
            background: #111111;
            border-left: 3px solid;
            border-radius: 3px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 90px 1fr 160px;
            gap: 12px;
            align-items: center;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .vlan-item:hover,
        .vlan-item.active {
            background: #1a1a1a;
        }

        .vlan-id   { font-weight: 700; font-size: 0.875rem; }
        .vlan-name { font-weight: 500; color: #a3a3a3; }
        .vlan-subnet { text-align: right; color: #525252; font-size: 0.75rem; }

        /* VLAN color coding */
        .vlan-10  { border-left-color: #5eead4; }
        .vlan-20  { border-left-color: #f87171; }
        .vlan-30  { border-left-color: #fbbf24; }
        .vlan-40  { border-left-color: #4ade80; }
        .vlan-50  { border-left-color: #c084fc; }
        .vlan-99  { border-left-color: #34d399; }
        .vlan-999 { border-left-color: #818cf8; }

        /* Expanded device list under a VLAN row */
        .vlan-device-list {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 10px;
            border-top: 1px solid #262626;
            margin-top: 4px;
        }

        .vlan-device-chip {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #a3a3a3;
            background: rgba(94, 234, 212, 0.04);
            border: 1px solid #262626;
            border-radius: 3px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vlan-device-chip::before { content: '>'; color: #5eead4; font-weight: 700; font-size: 0.625rem; }

        /* -- Highlights section --------------------------------------------- */
        .improvements-section {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .improvements-title {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .improvements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 16px;
        }

        .improvement-card {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            transition: border-color 0.2s ease;
        }

        .improvement-card:hover {
            border-color: #525252;
        }

        .improvement-icon { font-size: 1.5rem; margin-bottom: 12px; }
        .improvement-title { font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; color: #fafafa; }
        .improvement-desc  { font-size: 0.875rem; line-height: 1.7; color: #737373; }

        /* -- Security box --------------------------------------------------- */
        .security-check {
            background: rgba(94, 234, 212, 0.04);
            border-left: 3px solid #5eead4;
            border-radius: 3px;
            padding: 16px 20px;
            margin-top: 20px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
        }

        .security-check-title {
            font-weight: 700;
            color: #5eead4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .security-check ul {
            color: #737373;
        }

        /* -- Legend ---------------------------------------------------------- */
        .legend {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
        }

        .legend-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #525252;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #737373;
        }

        .legend-color { width: 32px; height: 3px; border-radius: 2px; }

        /* -- Filter tabs ---------------------------------------------------- */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-tab {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 3px;
            border: 1px solid;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            background: transparent;
        }

        /* -- Scrollbar ------------------------------------------------------ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111111; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }

        /* -- Responsive ----------------------------------------------------- */
        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .topology-section, .improvements-section { padding: 20px; }
            .vlan-item { grid-template-columns: 80px 1fr; }
            .vlan-subnet { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        /* -- Data ----------------------------------------------------------- */

        const VLAN_COLOR = {
            10: '#5eead4', 20: '#f87171', 30: '#fbbf24',
            40: '#4ade80', 50: '#c084fc', 99: '#34d399', 999: '#818cf8',
        };

        const VLANS = [
            {
                id: 10,  name: 'HOME',    subnet: '10.10.0.0/24',
                devices: ['Workstation', 'Routers of Rohan (WiFi)'],
            },
            {
                id: 20,  name: 'MALWARE', subnet: '10.20.0.0/24',
                devices: ['Kali Linux VM', 'Parrot OS VM', 'Security Onion VM'],
            },
            {
                id: 30,  name: 'LAB',     subnet: '10.30.0.0/24',
                devices: ['Cisco CML VM', 'Netbox VM', 'LLM Server VM', 'Windows 11 VM', 'Home Assistant VM', 'Raspberry Pi', 'MkDocs LXC', 'Bookstack LXC', 'Twingate LXC'],
            },
            {
                id: 40,  name: 'SERVERS', subnet: '10.40.0.0/28',
                devices: ['TrueNAS VM', 'NAS (Backup)', 'Docker Host 1 VM', 'Docker Host 2 VM', 'Docker Host 3 VM', 'Podman Host VM'],
            },
            {
                id: 50,  name: 'IoT',     subnet: '10.50.0.0/24',
                devices: ['IoT devices (SSID: IoT WiFi)'],
            },
            {
                id: 99,  name: 'MGMT',    subnet: '10.99.0.0/24',
                devices: ['OPNsense VM', 'USW Pro Max 16 PoE', 'Cisco Catalyst 2960X', 'Unifi AP', 'DNS 1', 'DNS 2 LXC'],
            },
            {
                id: 999, name: 'NATIVE',  subnet: 'No IP — trunk only',
                devices: ['Trunk: OPNsense → Dist Switch', 'All inter-switch links'],
            },
        ];

        const PROXMOX_GUESTS = [
            { name: 'DNS 2',         type: 'LXC', vlanId: 99, icon: '>' },
            { name: 'Twingate',      type: 'LXC', vlanId: 30, icon: '>' },
            { name: 'Bookstack',     type: 'LXC', vlanId: 30, icon: '>' },
            { name: 'MkDocs',        type: 'LXC', vlanId: 30, icon: '>' },
            { name: 'TrueNAS',       type: 'VM',  vlanId: 40, icon: '>' },
            { name: 'Docker Host 1', type: 'VM',  vlanId: 40, icon: '>' },
            { name: 'Docker Host 2', type: 'VM',  vlanId: 40, icon: '>' },
            { name: 'Docker Host 3', type: 'VM',  vlanId: 40, icon: '>' },
            { name: 'Windows 11',    type: 'VM',  vlanId: 30, icon: '>' },
            { name: 'Home Asst.',    type: 'VM',  vlanId: 30, icon: '>' },
            { name: 'Netbox',        type: 'VM',  vlanId: 30, icon: '>' },
            { name: 'Cisco CML',     type: 'VM',  vlanId: 30, icon: '>' },
            { name: 'LLM Server',    type: 'VM',  vlanId: 30, icon: '>' },
            { name: 'Kali Linux',    type: 'VM',  vlanId: 20, icon: '>' },
            { name: 'Parrot OS',     type: 'VM',  vlanId: 20, icon: '>' },
            { name: 'Sec. Onion',    type: 'VM',  vlanId: 20, icon: '>' },
            { name: 'Podman Host',   type: 'VM',  vlanId: 40, icon: '>' },
        ];

        const HIGHLIGHTS = [
            {
                icon: '~',
                title: 'Virtualised Firewall',
                desc:  'OPNsense runs as a VM on Proxmox Node 1. All traffic passes through it before reaching the distribution switch, with VLAN-aware firewall rules per segment.',
            },
            {
                icon: '~',
                title: 'Unifi Distribution Core',
                desc:  'USW Pro Max 16 PoE aggregates every VLAN trunk and provides PoE to the access point. Managed centrally via the Unifi Network Application.',
            },
            {
                icon: '~',
                title: 'Isolated Lab Segment',
                desc:  'VLAN 30 (Lab) contains the LLM Server, Cisco CML, Netbox, Windows 11, Home Assistant, Raspberry Pi, and internal services — kept completely separate from the home network so experiments stay contained.',
            },
            {
                icon: '~',
                title: 'Malware Sandbox',
                desc:  'VLAN 20 hard-isolates Kali, Parrot OS and Security Onion with a deny-all outbound firewall rule, preventing any lateral movement into the main network.',
            },
            {
                icon: '~',
                title: 'Dedicated Management',
                desc:  'VLAN 99 hosts network management devices alongside DNS infrastructure (DNS 1 & DNS 2). VLAN 999 is the secure native/trunk VLAN with no IP assignment, mitigating VLAN hopping.',
            },
            {
                icon: '~',
                title: 'Zero Trust Remote Access',
                desc:  'Twingate LXC on VLAN 30 provides Zero Trust Network Access to internal services without exposing any ports or running a traditional VPN.',
            },
        ];

        /* -- Helpers -------------------------------------------------------- */

        const vc = (id) => VLAN_COLOR[id] || '#525252';

        /* -- Sub-components ------------------------------------------------- */

        const Connector = ({ label }) => (
            <div className="layer-connector">
                <div className="connector-line" />
                <div className="connector-arrow">|</div>
                {label && <div className="connector-label">{label}</div>}
            </div>
        );

        const DeviceNode = ({
            icon, name, subtitle, vlanId,
            onClick,
        }) => (
            <div
                className={`device${onClick ? ' clickable' : ''}`}
                onClick={onClick}
            >
                <div className="device-header">
                    <div className="device-icon">
                        {icon}
                    </div>
                    <div>
                        <div className="device-name">
                            {name}
                        </div>
                        {subtitle && <div className="device-subtitle">{subtitle}</div>}
                    </div>
                </div>
                {vlanId && (
                    <span className="vlan-badge" style={{
                        background: `${vc(vlanId)}12`,
                        color:       vc(vlanId),
                        border:     `1px solid ${vc(vlanId)}30`,
                    }}>
                        VLAN {vlanId}
                    </span>
                )}
            </div>
        );

        /* -- Root component ------------------------------------------------- */

        const HomelabTopology = () => {
            const [selectedVlan, setSelectedVlan] = useState(null);
            const [pveExpanded,  setPveExpanded]  = useState(true);
            const [expandedVlan, setExpandedVlan] = useState(null);

            const toggleFilter = (id) => setSelectedVlan(prev => prev === id ? null : id);
            const toggleVlanRow = (id) => setExpandedVlan(prev => prev === id ? null : id);

            const dimmed = (g) => selectedVlan !== null && g.vlanId !== selectedVlan;

            const filteredVlans = selectedVlan
                ? VLANS.filter(v => v.id === selectedVlan)
                : VLANS;

            return (
                <div className="container">

                    {/* Header */}
                    <div className="header">
                        <h1>Home Lab Network Topology</h1>
                        <p className="subtitle">Proxmox &middot; OPNsense &middot; Unifi &middot; 7 VLANs &middot; 17 Guests</p>
                    </div>

                    {/* Stats */}
                    <div className="stats-row">
                        {[
                            ['2',  'Proxmox Nodes'],
                            ['13', 'Virtual Machines'],
                            ['4',  'LXC Containers'],
                            ['7',  'VLANs'],
                            ['3',  'Switches / APs'],
                            ['2',  'WiFi SSIDs'],
                        ].map(([n, l]) => (
                            <div key={l} className="stat-card">
                                <div className="stat-number">{n}</div>
                                <div className="stat-label">{l}</div>
                            </div>
                        ))}
                    </div>

                    {/* -- Physical Topology -- */}
                    <div className="topology-section">
                        <div className="section-title">Physical Topology</div>

                        <div className="topology-layers">

                            {/* WAN */}
                            <div className="topology-layer">
                                <div className="layer-label">WAN</div>
                                <div className="layer-nodes">
                                    <DeviceNode icon="~" name="Internet" subtitle="ISP Upstream" />
                                </div>
                            </div>

                            <Connector label="WAN uplink" />

                            {/* Edge */}
                            <div className="topology-layer">
                                <div className="layer-label">Edge &middot; Proxmox Node 1</div>
                                <div className="layer-nodes">
                                    <DeviceNode
                                        icon="F" name="OPNsense VM" subtitle="Firewall / Router"
                                        vlanId={99}
                                        onClick={() => toggleFilter(99)} />
                                    <DeviceNode
                                        icon="D" name="DNS 1" subtitle="Primary DNS Server"
                                        vlanId={99}
                                        onClick={() => toggleFilter(99)} />
                                </div>
                            </div>

                            <Connector label="Trunk port &middot; VLAN 999" />

                            {/* Distribution */}
                            <div className="topology-layer">
                                <div className="layer-label">Distribution Layer</div>
                                <div className="layer-nodes">
                                    <DeviceNode
                                        icon="S" name="USW Pro Max 16 PoE" subtitle="Distribution Switch"
                                        vlanId={99}
                                        onClick={() => toggleFilter(99)} />
                                </div>
                            </div>

                            <Connector label="Tagged VLANs on all trunk ports" />

                            {/* Access */}
                            <div className="topology-layer">
                                <div className="layer-label">Access Layer</div>
                                <div className="layer-nodes">
                                    <DeviceNode
                                        icon="C" name="Catalyst 2960X" subtitle="Cisco Access Switch"
                                        vlanId={99}
                                        onClick={() => toggleFilter(99)} />
                                    <DeviceNode
                                        icon="W" name="Unifi AP" subtitle="Wireless Access Point"
                                        vlanId={99}
                                        onClick={() => toggleFilter(99)} />
                                    <DeviceNode
                                        icon="P" name="Workstation" subtitle="Direct Connect"
                                        vlanId={10}
                                        onClick={() => toggleFilter(10)} />
                                    <DeviceNode
                                        icon="N" name="NAS (Backup)" subtitle="Direct Connect"
                                        vlanId={40}
                                        onClick={() => toggleFilter(40)} />
                                </div>
                            </div>

                            <Connector label="Trunk &middot; all VLANs" />

                            {/* Proxmox Node 2 */}
                            <div className="topology-layer">
                                <div className="layer-label">Server Layer &middot; Proxmox Node 2</div>
                                <div style={{ width: '100%' }}>
                                    <div className="proxmox-compound">
                                        <div className="proxmox-header"
                                            onClick={() => setPveExpanded(e => !e)}>
                                            <div className="proxmox-title">
                                                PROXMOX NODE 2
                                            </div>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                                <span className="proxmox-meta">13 VMs &middot; 4 LXCs</span>
                                                <span style={{ color: '#5eead4', fontSize: '0.875rem', fontFamily: "'Fira Code', monospace" }}>
                                                    {pveExpanded ? '[-]' : '[+]'}
                                                </span>
                                            </div>
                                        </div>
                                        {pveExpanded && (
                                            <div className="guest-grid">
                                                {PROXMOX_GUESTS.map((g, i) => (
                                                    <div key={i}
                                                        className={`guest-card${dimmed(g) ? ' dimmed' : ''}`}
                                                        style={{ borderLeftColor: vc(g.vlanId) }}
                                                        onClick={() => toggleFilter(g.vlanId)}>
                                                        <span style={{ color: vc(g.vlanId), fontWeight: 700, fontSize: '0.625rem' }}>{g.icon}</span>
                                                        <div>
                                                            <div className="guest-name">{g.name}</div>
                                                            <div className="guest-type">{g.type}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <Connector label="Wireless SSIDs via Unifi AP &middot; wired via Catalyst 2960X" />

                            {/* Wireless / edge endpoints */}
                            <div className="topology-layer">
                                <div className="layer-label">Wireless &amp; Edge Endpoints</div>
                                <div className="layer-nodes">
                                    <DeviceNode
                                        icon="W" name="Routers of Rohan" subtitle="Home WiFi SSID"
                                        vlanId={10}
                                        onClick={() => toggleFilter(10)} />
                                    <DeviceNode
                                        icon="I" name="IoT WiFi" subtitle="IoT SSID"
                                        vlanId={50}
                                        onClick={() => toggleFilter(50)} />
                                    <DeviceNode
                                        icon="R" name="Raspberry Pi" subtitle="via Catalyst 2960X"
                                        vlanId={30}
                                        onClick={() => toggleFilter(30)} />
                                </div>
                            </div>

                        </div>

                        {selectedVlan && (
                            <div style={{ marginTop: 20, fontFamily: "'Fira Code', monospace",
                                fontSize: '0.75rem', color: '#525252', textAlign: 'center' }}>
                                Showing VLAN {selectedVlan} — click any node or "All" to clear filter
                            </div>
                        )}
                    </div>

                    {/* -- VLAN Map -- */}
                    <div className="topology-section">
                        <div className="section-title">VLAN Map</div>

                        {/* Filter tabs */}
                        <div className="filter-tabs">
                            <button
                                className="filter-tab"
                                style={{
                                    borderColor: '#525252',
                                    background:  selectedVlan === null ? '#525252' : 'transparent',
                                    color:       selectedVlan === null ? '#111111' : '#525252',
                                }}
                                onClick={() => setSelectedVlan(null)}>
                                All
                            </button>
                            {VLANS.map(v => (
                                <button key={v.id}
                                    className="filter-tab"
                                    style={{
                                        borderColor: vc(v.id),
                                        background:  selectedVlan === v.id ? vc(v.id) : 'transparent',
                                        color:       selectedVlan === v.id ? '#111111' : vc(v.id),
                                    }}
                                    onClick={() => toggleFilter(v.id)}>
                                    VLAN {v.id}
                                </button>
                            ))}
                        </div>

                        {/* VLAN rows */}
                        <div className="vlan-list">
                            {filteredVlans.map(vlan => (
                                <div key={vlan.id}>
                                    <div
                                        className={`vlan-item vlan-${vlan.id}${expandedVlan === vlan.id ? ' active' : ''}`}
                                        onClick={() => toggleVlanRow(vlan.id)}>
                                        <div className="vlan-id" style={{ color: vc(vlan.id) }}>
                                            VLAN {vlan.id}
                                        </div>
                                        <div className="vlan-name">{vlan.name}</div>
                                        <div className="vlan-subnet">{vlan.subnet}</div>
                                    </div>
                                    {expandedVlan === vlan.id && (
                                        <div style={{
                                            background: '#1a1a1a',
                                            borderLeft: `3px solid ${vc(vlan.id)}`,
                                            borderRadius: '0 0 3px 3px',
                                            padding: '12px 16px',
                                            marginTop: -2,
                                        }}>
                                            <div className="vlan-device-list">
                                                {vlan.devices.map((d, i) => (
                                                    <span key={i} className="vlan-device-chip">{d}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="security-check">
                            <div className="security-check-title">Security Posture</div>
                            <ul style={{ marginLeft: '20px', lineHeight: '1.8' }}>
                                <li>VLAN 999 is the secure native trunk VLAN — no IP assignment</li>
                                <li>Malware lab (VLAN 20) isolated with strict deny-all firewall rules</li>
                                <li>VLAN 99 hosts management devices and DNS infrastructure (DNS 1 &amp; DNS 2)</li>
                                <li>Zero Trust remote access via Twingate — no exposed public ports</li>
                            </ul>
                        </div>
                    </div>

                    {/* -- Lab Highlights -- */}
                    <div className="improvements-section">
                        <div className="improvements-title">
                            Lab Highlights
                        </div>
                        <div className="improvements-grid">
                            {HIGHLIGHTS.map((h, i) => (
                                <div key={i} className="improvement-card">
                                    <div className="improvement-title">{h.title}</div>
                                    <div className="improvement-desc">{h.desc}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* -- Legend -- */}
                    <div className="legend">
                        <div className="legend-title">VLAN Color Legend</div>
                        <div className="legend-grid">
                            {VLANS.map(v => (
                                <div key={v.id} className="legend-item">
                                    <div className="legend-color" style={{ backgroundColor: vc(v.id) }} />
                                    <span>VLAN {v.id} — {v.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<HomelabTopology />, document.getElementById('root'));
    </script>
</body>
</html>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #111111;
            color: #b0b0b0;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* -- Header --------------------------------------------------------- */
        .header {
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #262626;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 2rem;
            font-weight: 400;
            color: #fafafa;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .subtitle {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            color: #525252;
        }

        /* -- Stats row ------------------------------------------------------ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px 16px;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: #525252;
        }

        .stat-number {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 1.75rem;
            font-weight: 700;
            color: #5eead4;
        }

        .stat-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            color: #525252;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* -- Section wrapper ------------------------------------------------ */
        .topology-section {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .section-title {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* -- Physical topology layers --------------------------------------- */
        .topology-layers {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .topology-layer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .layer-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #525252;
            margin-bottom: 10px;
        }

        .layer-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        /* -- Device cards --------------------------------------------------- */
        .device {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 18px;
            transition: border-color 0.2s ease;
            min-width: 170px;
        }

        .device:hover {
            border-color: #525252;
        }

        .device.clickable { cursor: pointer; }

        .device-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon {
            width: 38px; height: 38px;
            background: rgba(94, 234, 212, 0.08);
            border: 1px solid rgba(94, 234, 212, 0.15);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .device-name {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #fafafa;
        }

        .device-subtitle {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            color: #525252;
            margin-top: 2px;
        }

        .vlan-badge {
            display: inline-block;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.625rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 3px;
            margin-top: 8px;
        }

        /* -- Connectors ----------------------------------------------------- */
        .layer-connector {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0;
        }

        .connector-line {
            width: 1px; height: 24px;
            background: #262626;
        }

        .connector-arrow {
            font-size: 0.75rem;
            color: #525252;
        }

        .connector-label {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.625rem;
            color: #525252;
            margin-top: 2px;
        }

        /* -- Proxmox compound box ------------------------------------------- */
        .proxmox-compound {
            width: 100%;
            background: rgba(94, 234, 212, 0.03);
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
        }

        .proxmox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .proxmox-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            color: #5eead4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .proxmox-meta {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #525252;
        }

        .guest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .guest-card {
            background: #111111;
            border-left: 3px solid;
            border-radius: 3px;
            padding: 8px 12px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .guest-card:hover {
            background: #1a1a1a;
        }

        .guest-card.dimmed { opacity: 0.15; }

        .guest-name { color: #a3a3a3; font-weight: 500; }
        .guest-type { font-size: 0.625rem; color: #525252; text-transform: uppercase; letter-spacing: 0.5px; }

        /* -- VLAN items ----------------------------------------------------- */

            gap: 8px;

            border-left: 3px solid;
            border-radius: 3px;

            gap: 12px;
            align-items: center;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .vlan-item:hover,

            background: #1a1a1a;
        }

        .vlan-id   { font-weight: 700; font-size: 0.875rem; }
        .vlan-name { font-weight: 500; color: #a3a3a3; }
        .vlan-subnet { text-align: right; color: #525252; font-size: 0.75rem; }

        .vlan-30  { border-left-color: #fbbf24; }
        .vlan-40  { border-left-color: #4ade80; }
        .vlan-50  { border-left-color: #c084fc; }
        .vlan-99  { border-left-color: #34d399; }
        .vlan-999 { border-left-color: #818cf8; }

            color: #5eead4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;

            color: #737373;

            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
        }

        .legend-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #525252;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #737373;

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;

            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 3px;
            border: 1px solid;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            background: transparent;

        ::-webkit-scrollbar-track { background: #111111; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .topology-section, .improvements-section { padding: 20px; }
            .vlan-item { grid-template-columns: 80px 1fr; }
            .vlan-subnet { display: none; }
        }

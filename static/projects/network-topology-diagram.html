<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLAN Segmentation - Network Topology Comparison</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/favicon-32.png">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #111111;
            color: #b0b0b0;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* -- Header --------------------------------------------------------- */
        .header {
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #262626;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 2rem;
            font-weight: 400;
            color: #fafafa;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .subtitle {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            color: #525252;
        }

        /* -- Comparison layout ---------------------------------------------- */
        .comparison-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        @media (max-width: 900px) {
            .comparison-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* -- Section wrapper ------------------------------------------------ */
        .topology-section {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px;
            transition: border-color 0.2s ease;
        }

        .topology-section:hover {
            border-color: #525252;
        }

        /* -- Before/After badges -------------------------------------------- */
        .section-badge {
            display: inline-block;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 3px 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        .badge-before {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #f87171;
        }

        .badge-after {
            background: rgba(94, 234, 212, 0.08);
            border: 1px solid rgba(94, 234, 212, 0.25);
            color: #5eead4;
        }

        .section-title {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fafafa;
        }

        /* -- Network diagram ------------------------------------------------ */
        .network-diagram {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* -- Device cards --------------------------------------------------- */
        .device {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 18px;
            transition: border-color 0.2s ease;
        }

        .device:hover {
            border-color: #525252;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .device-icon {
            width: 38px;
            height: 38px;
            background: rgba(94, 234, 212, 0.08);
            border: 1px solid rgba(94, 234, 212, 0.15);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .device-name {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #fafafa;
        }

        /* -- VLAN items ----------------------------------------------------- */
        .vlan-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vlan-item {
            background: #111111;
            border-left: 3px solid;
            border-radius: 3px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 90px 1fr 160px;
            gap: 12px;
            align-items: center;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
            transition: background 0.2s ease;
        }

        .vlan-item:hover {
            background: #1a1a1a;
        }

        .vlan-id     { font-weight: 700; font-size: 0.875rem; }
        .vlan-name   { font-weight: 500; color: #a3a3a3; }
        .vlan-subnet { text-align: right; color: #525252; font-size: 0.75rem; }

        /* VLAN color coding */
        .vlan-1   { border-left-color: #f87171; }
        .vlan-10  { border-left-color: #5eead4; }
        .vlan-20  { border-left-color: #f87171; }
        .vlan-30  { border-left-color: #fbbf24; }
        .vlan-40  { border-left-color: #4ade80; }
        .vlan-50  { border-left-color: #c084fc; }
        .vlan-99  { border-left-color: #34d399; }
        .vlan-999 { border-left-color: #818cf8; }

        /* -- Security warning ----------------------------------------------- */
        .security-warning {
            background: rgba(248, 113, 113, 0.04);
            border-left: 3px solid #f87171;
            border-radius: 3px;
            padding: 16px 20px;
            margin-top: 20px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
        }

        .security-warning-title {
            font-weight: 700;
            color: #f87171;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .security-warning ul {
            color: #737373;
        }

        /* -- Security check ------------------------------------------------- */
        .security-check {
            background: rgba(94, 234, 212, 0.04);
            border-left: 3px solid #5eead4;
            border-radius: 3px;
            padding: 16px 20px;
            margin-top: 20px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8125rem;
        }

        .security-check-title {
            font-weight: 700;
            color: #5eead4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .security-check ul {
            color: #737373;
        }

        /* -- Improvements section ------------------------------------------- */
        .improvements-section {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .improvements-title {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .improvements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 16px;
        }

        .improvement-card {
            background: #111111;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            transition: border-color 0.2s ease;
        }

        .improvement-card:hover {
            border-color: #525252;
        }

        .improvement-icon  { font-size: 1.5rem; margin-bottom: 12px; }
        .improvement-title { font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; color: #fafafa; }
        .improvement-desc  { font-size: 0.875rem; line-height: 1.7; color: #737373; }

        /* -- Legend --------------------------------------------------------- */
        .legend {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
        }

        .legend-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #525252;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            color: #737373;
        }

        .legend-color { width: 32px; height: 3px; border-radius: 2px; }

        /* -- Scrollbar ------------------------------------------------------ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111111; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }

        /* -- Responsive ----------------------------------------------------- */
        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .topology-section { padding: 20px; }
            .vlan-item { grid-template-columns: 80px 1fr; }
            .vlan-subnet { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="network-topology-diagram.js"></script>
</body>
</html>

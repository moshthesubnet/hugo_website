    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            color: #e0e6f0;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00d9ff, transparent);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00d9ff 0%, #7b61ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: #8b95b0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .comparison-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 60px;
        }

        @media (max-width: 1200px) {
            .comparison-wrapper {
                grid-template-columns: 1fr;
                gap: 60px;
            }
        }

        .topology-section {
            background: rgba(15, 22, 41, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .topology-section:hover {
            border-color: rgba(0, 217, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0, 217, 255, 0.1);
        }

        .section-badge {
            position: absolute;
            top: -15px;
            left: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .badge-before {
            background: linear-gradient(135deg, rgba(255, 82, 82, 0.2), rgba(255, 82, 82, 0.1));
            border: 1px solid rgba(255, 82, 82, 0.5);
            color: #ff8a8a;
        }

        .badge-after {
            background: linear-gradient(135deg, rgba(0, 217, 136, 0.2), rgba(0, 217, 136, 0.1));
            border: 1px solid rgba(0, 217, 136, 0.5);
            color: #00ff9d;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .network-diagram {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .device {
            background: linear-gradient(135deg, rgba(20, 30, 55, 0.8), rgba(15, 22, 41, 0.9));
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .device::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .device:hover::before {
            left: 100%;
        }

        .device:hover {
            border-color: rgba(0, 217, 255, 0.6);
            transform: translateX(5px);
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .device-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d9ff, #7b61ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .device-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00d9ff;
        }

        .vlan-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vlan-item {
            background: rgba(10, 14, 39, 0.5);
            border-left: 4px solid;
            border-radius: 8px;
            padding: 15px 18px;
            display: grid;
            grid-template-columns: 80px 1fr 140px;
            gap: 15px;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .vlan-item:hover {
            background: rgba(10, 14, 39, 0.8);
            transform: translateX(5px);
        }

        .vlan-id {
            font-weight: 700;
            font-size: 1rem;
        }

        .vlan-name {
            font-weight: 500;
            color: #c8d1e0;
        }

        .vlan-subnet {
            text-align: right;
            color: #8b95b0;
            font-size: 0.85rem;
        }

        .vlan-1 { border-left-color: #ff5252; }
        .vlan-10 { border-left-color: #00d9ff; }
        .vlan-20 { border-left-color: #ff3d71; }
        .vlan-30 { border-left-color: #ffa41b; }
        .vlan-40 { border-left-color: #4caf50; }
        .vlan-50 { border-left-color: #9c27b0; }

        .improvements-section {

        .improvements-title {

            font-size: 2rem;
            font-weight: 700;

            display: flex;

        .improvements-grid {

        .improvement-card {

            color: #00d9ff;

            font-weight: 700;
            color: #00ff9d;
